<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" th:href="@{/css/header.css}">
</head>

<body>
	<header th:fragment="layout-header">
		<div class="header-container">
			<div class="header-title">
				<h1><a th:href="@{/home}" class="logo-link">OnePiece Card Lab</a></h1>
			</div>

			<!-- デスクトップメニュー -->
			<nav class="header-nav">
				<a th:href="@{/card/list}" class="nav-link">カードリスト</a>
				<a th:href="@{/choice/leader}" class="nav-link">デッキ作成</a>
				<a th:href="@{/deck/list}" class="nav-link">デッキ一覧</a>
				<a th:href="@{/setting}" class="nav-link">設定</a>
				<a th:if="${session.role} == 'admin'" th:href="@{/admin/config}" class="nav-link admin-link">管理者設定</a>
			</nav>

			<div class="header-name">
				<div class="header-user">
					<p>ようこそ、<span th:text="${session.username}"></span>さん</p>
				</div>
			</div>
			<div class="header-logout">
				<div class="header-logout">
					<a th:href="@{/logout}" class="logout-button">ログアウト</a>
				</div>
			</div>

			<!-- ハンバーガーメニューボタン -->
			<button class="hamburger" id="hamburger" aria-label="メニュー">
				<span></span>
				<span></span>
				<span></span>
			</button>
		</div>

		<!-- モバイルメニュー -->
		<div class="mobile-menu" id="mobileMenu">
			<div class="mobile-menu-content">
				<nav class="mobile-menu-links">
					<a th:href="@{/card/list}" class="nav-link">カードリスト</a>
					<a th:href="@{/choice/leader}" class="nav-link">デッキ作成</a>
					<a th:href="@{/deck/list}" class="nav-link">デッキ一覧</a>
					<a th:href="@{/setting}" class="nav-link">設定</a>
					<a th:if="${session.role} == 'admin'" th:href="@{/admin/config}"
						class="nav-link admin-link">管理者設定</a>
				</nav>
				<a th:href="@{/logout}" class="logout-button">ログアウト</a>
			</div>
		</div>

		<script>
			(function () {
				console.log('Script loaded');

				function initMenu() {
					console.log('Init menu function called');

					const hamburger = document.getElementById('hamburger');
					const mobileMenu = document.getElementById('mobileMenu');

					console.log('hamburger:', hamburger);
					console.log('mobileMenu:', mobileMenu);

					if (hamburger && mobileMenu) {
						console.log('Elements found, adding event listener');

						hamburger.addEventListener('click', function (e) {
							e.stopPropagation();
							console.log('Hamburger clicked');
							hamburger.classList.toggle('active');
							mobileMenu.classList.toggle('active');
							console.log('Menu active:', mobileMenu.classList.contains('active'));
						});

						// 外クリックでメニューを閉じる
						document.addEventListener('click', function (e) {
							if (mobileMenu.classList.contains('active')) {
								// メニュー内のクリックは無視
								if (!mobileMenu.contains(e.target) && !hamburger.contains(e.target)) {
									console.log('Outside click detected');
									hamburger.classList.remove('active');
									mobileMenu.classList.remove('active');
								}
							}
						});

						// モバイルメニュー内のリンクをクリックしたらメニューを閉じる
						const mobileMenuLinks = mobileMenu.querySelectorAll('a');
						console.log('Found links:', mobileMenuLinks.length);
						mobileMenuLinks.forEach(function (link) {
							link.addEventListener('click', function () {
								hamburger.classList.remove('active');
								mobileMenu.classList.remove('active');
							});
						});
					} else {
						console.log('Elements not found!');
					}
				}

				// DOMが読み込まれたら実行
				if (document.readyState === 'loading') {
					document.addEventListener('DOMContentLoaded', initMenu);
				} else {
					initMenu();
				}
			})();
		</script>
	</header>
</body>

</html>
