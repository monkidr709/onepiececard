<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="600" height="100">
  <defs>
    <filter id="subtle-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2"/>
      <feFlood flood-color="#00f3ff" result="color1"/>
      <feComposite in="color1" in2="blur1" operator="in" result="glow1"/>
      <feFlood flood-color="#ff00de" result="color2"/>
      <feComposite in="color2" in2="blur2" operator="in" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="300" y="65" font-family="Arial, sans-serif" font-size="42" font-weight="700" 
        text-anchor="middle" letter-spacing="5" fill="#00f3ff" filter="url(#subtle-glow)" opacity="0.5">
    OnePiece Card Lab
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="300" y="65" font-family="Arial, sans-serif" font-size="42" font-weight="700" 
        text-anchor="middle" letter-spacing="5" fill="#00f3ff" filter="url(#subtle-glow)">
    OnePiece Card Lab
  </text>
</svg>